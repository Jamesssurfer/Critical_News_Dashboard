# .github/workflows/critical-news-logger.yml
name: Critical News Logger Pipeline

on:
  repository_dispatch:
    types: [critical_news_update]
  workflow_dispatch:
    inputs:
      category:
        description: 'Geopolitical / Currency / Trade War'
        required: true
      title:
        description: 'Headline'
        required: true
      impact_level:
        description: 'HIGH, MEDIUM, LOW'
        required: true
      summary:
        description: 'Details'
        required: true
  schedule:
    # Runs every 6 hours purely to re-age active/archive items.
    # Adjust cadence as you like — this does NOT create new entries.
    - cron: '0 */6 * * *'

permissions:
  contents: write

# Runs one at a time — if several batches dispatch close together
# (e.g. a large news.txt split into multiple chunks), they queue up
# instead of racing to commit/push simultaneously.
concurrency:
  group: critical-news-logger
  cancel-in-progress: false

jobs:
  log-and-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Logger Script
        env:
          REBUCKET_ONLY: ${{ github.event_name == 'schedule' && '1' || '0' }}
          DISPATCH_CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          MANUAL_CATEGORY: ${{ github.event.inputs.category }}
          MANUAL_TITLE: ${{ github.event.inputs.title }}
          MANUAL_IMPACT: ${{ github.event.inputs.impact_level }}
          MANUAL_SUMMARY: ${{ github.event.inputs.summary }}
        run: python scripts/logger.py

      - name: Commit Data Update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/
          if git diff-index --quiet HEAD; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "🤖 System: Updated and structured critical timeline files [skip ci]"

          # Retry loop: pull --rebase then push, in case another run
          # (or a manual push) landed in between checkout and now.
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push failed (attempt $attempt/5) — pulling and retrying..."
            git pull --rebase origin main
            sleep 3
          done
          echo "Push failed after 5 attempts."
          exit 1
