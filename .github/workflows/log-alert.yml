name: Information Agent Log Sync
on:
  repository_dispatch:
    types: [info_agent_alert]
  workflow_dispatch:

jobs:
  process-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install requests

      - name: Execute Chronological Log Rotator
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          # 💡 FIX: Storing the data layout inside a clean environment variable 
          # completely prevents Linux from breaking the text quotes apart!
          ALERT_DATA: '{"timestamp": "2026-08-24 03:29", "category": "🚨 TEST_RUN", "headline": "Manual pipeline validation run successful.", "market_bias": "Active"}'
        run: |
          python .github/scripts/rotate_logs.py "$ALERT_DATA"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "MacroTradingBot"
          git config --global user.email "bot@trading.internal"
          git add .
          git commit -m "Auto-Log & Rotate: Manual Trigger [System]" || echo "No changes to commit"
          git push
