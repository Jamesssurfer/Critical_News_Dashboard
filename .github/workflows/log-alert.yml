name: Information Agent Log Sync
on:
  repository_dispatch:
    types: [info_agent_alert]
  workflow_dispatch:

jobs:
  process-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install requests

      - name: Execute Chronological Log Rotator
        run: |
          python .github/scripts/rotate_logs.py '{"timestamp": "2026-08-24 03:47", "category": "🚨 TEST_RUN", "headline": "Manual pipeline validation run successful.", "market_bias": "Active"}'

      - name: Commit and Push Changes
        run: |
          git config --global user.name "MacroTradingBot"
          git config --global user.email "bot@trading.internal"
          git add .
          git commit -m "Auto-Log & Rotate: Manual Trigger [System]" || echo "No changes to commit"
          git push
