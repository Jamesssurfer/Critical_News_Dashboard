name: Information Agent Log Sync
on:
  repository_dispatch:
    types: [info_agent_alert]

jobs:
  process-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Chronological Log Rotator
        run: |
          python .github/scripts/rotate_logs.py '${{ json(github.event.client_payload) }}'

      - name: Commit and Push Changes
        run: |
          git config --global user.name "MacroTradingBot"
          git config --global user.email "bot@trading.internal"
          git add .
          git commit -m "Auto-Log & Rotate: ${{ github.event.client_payload.category }} [System]" || echo "No changes to commit"
          git push
